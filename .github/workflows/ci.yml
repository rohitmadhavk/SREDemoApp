name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  perf-regression-gate:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

      - name: Start application
        run: |
          dotnet run --configuration Release --no-build &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          # Wait for app to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5269/health > /dev/null 2>&1; then
              echo "App is ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run performance benchmark
        id: perf_check
        run: |
          BASELINE_MS=200
          THRESHOLD_MS=240
          ENDPOINTS=(
            "http://localhost:5269/api/products"
            "http://localhost:5269/api/products/1"
            "http://localhost:5269/api/products/search?query=electronics"
          )
          REQUESTS=10
          FAILED=0
          RESULTS=""

          for endpoint in "${ENDPOINTS[@]}"; do
            echo "Benchmarking $endpoint ($REQUESTS requests)..."
            TOTAL_MS=0
            for i in $(seq 1 $REQUESTS); do
              RESPONSE_MS=$(curl -o /dev/null -s -w "%{time_total}" "$endpoint")
              MS=$(echo "$RESPONSE_MS * 1000" | bc | cut -d'.' -f1)
              TOTAL_MS=$((TOTAL_MS + MS))
            done
            AVG_MS=$((TOTAL_MS / REQUESTS))
            echo "  Avg response time: ${AVG_MS}ms (threshold: ${THRESHOLD_MS}ms)"
            RESULTS="${RESULTS}\n  ${endpoint}: ${AVG_MS}ms"
            if [ "$AVG_MS" -gt "$THRESHOLD_MS" ]; then
              echo "  ❌ FAILED: ${AVG_MS}ms > ${THRESHOLD_MS}ms threshold"
              FAILED=1
            else
              echo "  ✅ PASSED: ${AVG_MS}ms ≤ ${THRESHOLD_MS}ms threshold"
            fi
          done

          echo -e "Benchmark results:$RESULTS"
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Performance regression detected. Avg response time exceeded ${THRESHOLD_MS}ms threshold (>20% over ${BASELINE_MS}ms baseline)."
            exit 1
          else
            echo "All endpoints are within performance threshold."
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill $APP_PID 2>/dev/null || true
          fi
